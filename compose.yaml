# Kastellan with `docker compose up -d --build`, then open http://<this machine>:8100
# Reach it only from your own network or VPN; it is not meant to face the internet.
#
# Host networking lets the checks see the network as the host does (ping, local names).
# On Docker Desktop (macOS, Windows), remove `network_mode` and use `ports` instead.

services:
  kastellan:
    build: .
    image: kastellan:local
    container_name: kastellan
    restart: unless-stopped
    network_mode: host
    # ports:
    #   - "8100:8100"
    environment:
      TZ: Etc/UTC # your time zone
      # KASTELLAN_HOSTS: kastellan.lan # names you open it by; IP addresses always work
      # KASTELLAN_DEMO: "1" # a made-up network with simulated results, to try it out
    volumes:
      - ./config:/config # config.yaml
      - ./data:/data # history (one CSV file per day)
