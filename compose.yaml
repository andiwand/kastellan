# Kastellan with `docker compose up -d`, then open http://<this machine>:8100
# Reach it only from your own network or VPN; it is not meant to face the internet.
#
# Host networking lets the checks see the network as the host does (ping, local names).
# On Docker Desktop (macOS, Windows), remove `network_mode` and use `ports` instead.

services:
  kastellan:
    image: ghcr.io/andiwand/kastellan:0.10.0
    # build: . # or build it from this checkout
    container_name: kastellan
    restart: unless-stopped
    network_mode: host
    # ports:
    #   - "8100:8100"
    #   - "5514:5514/udp" # only with the opt-in syslog port (Settings → Logs; host networking needs nothing)
    #   - "6514:6514" # only with syslog over TLS (Settings → Logs)
    environment:
      TZ: Etc/UTC # your time zone
      # KASTELLAN_HOSTS: kastellan.lan # names you open it by; IP addresses always work
      # KASTELLAN_DEMO: "1" # a made-up network with simulated results, to try it out
    volumes:
      - ./config:/config # config.yaml
      - ./data:/data # history, sign-in state, the hub's SSH key, the audit log
      # - /mnt/nas/kastellan:/backup # a place for Kastellan's own backup (Settings → Kastellan's own backup)

  # Remote desktop (RDP, VNC): Apache Guacamole's daemon. Kastellan talks to it on localhost;
  # it reaches the desktops. Leave it out if you don't use remote desktop.
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: kastellan-guacd
    restart: unless-stopped
    network_mode: host
    # guacd has no sign-in of its own: it must listen on localhost only. The image starts
    # `guacd -f -b 0.0.0.0 ... "$@"` (entrypoint.sh of 1.6.0); these arguments come last and win.
    command: ["-b", "127.0.0.1", "-l", "4822"]
