# Kastellan's configuration: the devices on your network and how to check them.
# Copy to data/config.yaml (or /config/config.yaml in Docker). Changes are picked up by themselves.

check_interval: 60 # seconds between checks, unless a check sets its own `interval`
retention_days: 30 # how long the history (one CSV file per day) is kept

devices:
  router:
    name: FRITZ!Box 7590
    host: 192.168.178.1
    kind: router # router, access-point, switch, server, pc, laptop, printer, camera, other
    checks:
      - ping
      - http: https://192.168.178.1 # any answer below 500 counts as up
        name: web

  nas:
    host: nas.lan
    kind: server
    parent: router # what it is connected through, for the graph (infrastructure; skip Wi-Fi clients)
    tags: [docker]
    checks:
      - ping
      - tcp: 22
        name: ssh
      - http: http://nas.lan:8096/health
        name: jellyfin
        expect: 200 # this status exactly
        interval: 30
      - http: https://media.example.org # the same service by its public name: its certificate
        name: jellyfin (public) #         is watched (valid, and not ending within 14 days)

  laptop:
    host: laptop.lan
    kind: laptop # pcs and laptops are offline when off, not down (always_on: false)

  vps:
    host: 203.0.113.20
    kind: server
    site: hetzner # where it is (default: home); the list groups by site, alarms name it
    checks:
      - ping
      - dns: www.example.org # does the name resolve...
        expect: 203.0.113.20 # ...to this address (or a list); optional
        server: 9.9.9.9 # the resolver to ask; default: the system's
        name: dns

sites: # optional names for the sites devices are at
  hetzner: Hetzner Cloud

# Device web pages through the hub, each on its own name: <device id>.<domain> (needs
# *.<domain> in your DNS, pointing at the hub). Only signed-in admins get through.
# web:
#   domain: kastellan.home.arpa
