# Lints and tests the backend and the web app, and checks the Docker image end to end:
# it builds the image, starts it in demo mode, and checks the API and the web app.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Test
        run: uv run pytest

  frontend:
    name: Web app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Check the format
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: Docker image (smoke test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: kastellan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start
        run: |
          docker run -d --name kastellan -e KASTELLAN_DEMO=1 -p 8100:8100 kastellan:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8100/api/health && break
            sleep 1
          done

      - name: Check
        run: |
          curl -sf http://localhost:8100/api/devices | tee devices.json
          grep -q '"fritzbox"' devices.json
          curl -sf 'http://localhost:8100/api/series?hours=24&buckets=24' | grep -q '"nas"'
          curl -sf http://localhost:8100/ | grep -q '<title>'

      - name: Logs
        if: always()
        run: docker logs kastellan
