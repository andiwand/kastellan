# A release: push a tag like v0.1.0. Builds the image for amd64 and arm64 (a Raspberry Pi
# works too), publishes it as ghcr.io/<owner>/kastellan:<version> and :latest, and creates the
# GitHub release with that version's section of CHANGELOG.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"" backend/pyproject.toml \
            || { echo "backend/pyproject.toml is not at $version" >&2; exit 1; }
          grep -q "^__version__ = \"$version\"" backend/src/kastellan/__init__.py \
            || { echo "kastellan/__init__.py is not at $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # The changelog section "## <version> ..." up to the next "## ".
          awk -v v="$version" '/^## / { on = index($0, "## " v) == 1; next } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no section for $version in CHANGELOG.md" >&2; exit 1; }

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          {
            cat notes.md
            echo
            echo "Image: \`${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}\` (amd64, arm64)"
          } > body.md
          # 0.x versions are pre-releases.
          pre=()
          [[ "$VERSION" == 0.* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --title "Kastellan $VERSION" --notes-file body.md "${pre[@]}"
