[project]
name = "kastellan"
version = "0.17.1"
readme = "README.md"
description = "One place to watch and administer every device on your home network"
requires-python = ">=3.13"
authors = [{ name = "Andreas Stefl" }]
license = "MIT"
dependencies = [
    "asyncssh>=2.24.1",
    "cryptography>=42",
    "dnspython>=2.9.2",
    "fastapi>=0.163.1",
    "h11>=0.16.0",
    "http-ece>=1.2.1",
    "httpx>=0.28.1",
    "icmplib>=3.0.4",
    "py-vapid>=1.9.6",
    "pydantic>=2.14.3",
    "ruamel-yaml>=0.19.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=15",
]

[project.scripts]
kastellan = "kastellan.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["ASYNC109"]

[tool.uv.build-backend]
module-name = "kastellan"
